[build]
  functions = "netlify/functions"

[[redirects]]
  from = "/manifest.json"
  to = "/.netlify/functions/addon/manifest.json"
  status = 200
  force = true

[[redirects]]
  from = "/catalog/:type/:id.json"
  to = "/.netlify/functions/addon/catalog/:type/:id.json"
  status = 200
  force = true
